<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화재 유형 탐구 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* VOICE: 소방 훈련 게임 — 긴박하지만 친근하게
   IDEA: 소방서 출동 미션 보드
   PICTURE: 캔버스 속 실제처럼 타오르는 불과 소화 약제 분사
   COLOUR/TYPE: 소방차 빨강 + 물 청록 + 경고 노랑, a시네마 단일 글꼴, 굵게 대신 색으로 강조
   LAYOUT: 상단 로고·점수, 6단계 진행 바, 단계별 미션 카드 */
:root{--bg:#fff8f3;--ink:#2b2220;--sub:#6d5f59;--red:#d7263d;--red2:#a3162a;--teal:#0f7b7b;--yel:#e89b00;--line:#ecdcd2;--card:#fff;
--A:#8a5a2b;--B:#d07a00;--C:#1f6fd1;--K:#b0306a;--ok:#1b9a57;--no:#d7263d;--gray:#b9aea8;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'a시네마L','a시네마','aCinemaL','a시네마M','Gaegu',sans-serif;font-weight:400;font-size:18px;line-height:1.55;overflow-x:clip}
b,strong,h1,h2,h3,h4,th{font-weight:400}
button,select,input{font:inherit;font-weight:400;color:inherit}
.hl{color:var(--red)} .ht{color:var(--teal)} .hy{color:var(--yel)}
.cA{color:var(--A)}.cB{color:var(--B)}.cC{color:var(--C)}.cK{color:var(--K)}
/* header */
header{background:linear-gradient(120deg,var(--red2),var(--red) 60%,#ef5b2a);color:#fff;padding:14px max(4vw,14px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(24px,3.4vw,36px);line-height:1.1;flex:1 1 260px}
header h1 small{display:block;font-size:16px;opacity:.9;margin-top:4px}
.brand{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:14px;padding:6px 12px 6px 6px;margin-left:auto}
.brand img{width:54px;height:54px}
.brand div{font-size:15px;line-height:1.25}.brand div span{color:var(--teal)}
/* nav */
.navwrap{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);padding:10px max(4vw,14px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 480px}
.stp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;min-height:44px;transition:transform .15s}
.stp:hover{transform:translateY(-2px)}
.stp i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gray);color:#fff;font-size:17px}
.stp.pass i{background:var(--ok)}.stp.fail i{background:var(--no)}
.stp.cur{border-color:var(--ink)}
.stp span{font-size:15px}
.stp.rep i{background:var(--yel)}
.score{display:flex;align-items:center;gap:10px;background:#2b2220;color:#fff;border-radius:14px;padding:6px 14px}
.score .big{font-size:28px;color:#ffd166;line-height:1}
.score .gr{font-size:22px;background:#fff;color:var(--red);border-radius:8px;padding:0 10px}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,14px) 60px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,26px);margin-bottom:18px}
.mtitle{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mtitle h2{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.15}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-size:15px;background:#fde7e3;color:var(--red2)}
.crit{background:#f3fbfa;border:2px dashed #a7d8d3;border-radius:12px;padding:10px 14px;font-size:16px;color:#21524f;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 20px;min-height:46px;cursor:pointer;background:var(--red);color:#fff;font-size:18px;box-shadow:0 4px 0 var(--red2);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #095555}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{background:var(--gray);box-shadow:none;cursor:not-allowed}
.btn:focus-visible,.stp:focus-visible,.opt:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}.grid2.g5{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:860px){.grid2,.grid2.g5{grid-template-columns:minmax(0,1fr)}}
/* drag */
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #d9c6ba;border-radius:12px;padding:8px 12px;margin:4px;cursor:grab;touch-action:none;user-select:none;font-size:16px;box-shadow:0 3px 0 #e8d8cd}
.chip.sel{border-color:var(--yel);background:#fff6df}
.chip.dragging{opacity:.3}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg);box-shadow:0 10px 20px rgba(0,0,0,.2);margin:0}
.chip.ok{border-color:var(--ok);background:#e8f7ee}.chip.bad{border-color:var(--no);background:#fde8e8;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dz{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:150px;background:#fffdfb;transition:background .15s}
.dz.over{background:#fff3d6;border-color:var(--yel)}
.dz h3{margin:0 0 2px;font-size:22px}.dz p{margin:0 0 6px;font-size:14px;color:var(--sub)}
.pool{min-height:80px;margin-top:14px;background:#fbf3ee}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;font-size:18px;flex:none}
.bA{background:var(--A)}.bB{background:var(--B)}.bC{background:var(--C)}.bK{background:var(--K)}
/* canvas */
.fig{position:relative;height:340px;border-radius:16px;overflow:hidden;background:linear-gradient(#2a2430,#463440)}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.fig .lab{position:absolute;left:12px;top:10px;color:#fff;font-size:17px;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:8px}
.typebtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;min-height:44px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tb.on{border-color:var(--ink);background:#fff6ef}
.tb .dot{width:12px;height:12px;border-radius:50%;background:var(--gray)}.tb.seen .dot{background:var(--ok)}
.note{background:#fff7e6;border-left:5px solid var(--yel);border-radius:8px;padding:10px 14px;font-size:16px;min-height:52px}
table.ft{width:100%;border-collapse:collapse}
table.ft td{border-bottom:2px solid var(--line);padding:8px 6px;vertical-align:middle}
.slot{min-height:56px;padding:4px}
/* options */
.case{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;background:#fffdfb}
.case h3{margin:0 0 6px;font-size:21px;color:var(--teal)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;cursor:pointer;min-height:44px;font-size:16px}
.opt:hover{border-color:#d4b8a8}
.opt.on{border-color:var(--teal);background:#e9f6f5}
.opt.good{border-color:var(--ok);background:#e8f7ee}.opt.wrong{border-color:var(--no);background:#fde8e8;color:#8d1c1c}
.gbtn{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:56px;min-height:44px;cursor:pointer;font-size:18px}
.gbtn.on{color:#fff;border-color:transparent}
.gbtn.on.gA{background:var(--A)}.gbtn.on.gB{background:var(--B)}.gbtn.on.gC{background:var(--C)}.gbtn.on.gK{background:var(--K)}
/* stage4 */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.tool{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;cursor:pointer;display:flex;gap:8px;align-items:center;min-height:56px;text-align:left;font-size:16px}
.tool.on{border-color:var(--teal);background:#e9f6f5}
.tool svg{flex:none}
.spray{width:100%;min-height:64px;font-size:21px;touch-action:none;user-select:none}
.spray.act{background:var(--teal);box-shadow:0 1px 0 #095555;transform:translateY(3px)}
.log{max-height:170px;overflow:auto;font-size:15px;background:#fbf6f2;border-radius:12px;padding:8px 12px}
.log p{margin:3px 0}
.meter{height:16px;background:#eee;border-radius:9px;overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,var(--yel),var(--red));transition:width .1s}
/* stage5 */
.chain{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.chain.head{font-size:15px;color:var(--sub);border-bottom:2px solid var(--ink)}
@media(max-width:860px){.chain{grid-template-columns:minmax(0,1fr)}.chain.head{display:none}}
select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:16px}
select.good{border-color:var(--ok);background:#e8f7ee}select.wrong{border-color:var(--no);background:#fde8e8}
.tri text{font-family:inherit}
/* stage6 */
.scene{height:220px;border-radius:16px;position:relative;overflow:hidden;background:#cfd8dc}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.ordbox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
@media(max-width:700px){.ordbox{grid-template-columns:repeat(2,minmax(0,1fr))}}
.oslot{border:2px dashed var(--line);border-radius:12px;min-height:70px;padding:8px;font-size:15px;background:#fffdfb}
.oslot em{font-style:normal;color:var(--red)}
/* result */
.res{border-radius:16px;padding:16px 18px;margin-top:16px}
.res.pass{background:#e8f7ee;border:2px solid #9ad5b2}.res.fail{background:#fdeceb;border:2px solid #f0a9a9}
.res h3{margin:0 0 6px;font-size:24px}
/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-size:clamp(30px,4.4vw,48px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
input[type=text]{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:18px;background:#fff}
.mlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
@media(max-width:600px){.mlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mlist div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px}
.mlist em{font-style:normal;color:var(--red);display:block;font-size:14px}
table.st{width:100%;border-collapse:collapse;font-size:16px;margin:10px 0}
table.st th,table.st td{border:2px solid var(--line);padding:8px;text-align:center}
table.st th{background:#fbefe8}
table.st td.l{text-align:left}
.o{color:var(--ok);font-size:22px}.x{color:var(--no);font-size:22px}
.report{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:clamp(16px,3vw,30px)}
.rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:10px}
.rhead h2{margin:0;font-size:clamp(28px,4vw,40px);color:var(--red)}
.gradebox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}
.gradebig{width:96px;height:96px;border-radius:20px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:58px}
.fb p{margin:6px 0;font-size:17px}
.up{background:#fff7e6;border:2px solid #f3cf7a;border-radius:14px;padding:12px 16px;margin-top:14px}
.ladder{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ladder span{border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-size:15px}
.ladder span.me{background:var(--red);color:#fff;border-color:var(--red)}
.fx{animation:pop .5s}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,.navwrap,.noprint{display:none!important}body{background:#fff}main{padding:0}.report{border:0}}
</style>
</head>

  <div class="steps" id="steps"></div>
  <div class="score"><div><div style="font-size:13px;opacity:.8">현재 점수</div><span class="big" id="hudScore">0</span> / 30</div><span class="gr" id="hudGrade">-</span></div>
</div>
<main id="app"></main>

<script>
{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TYPES={A:'A급 (일반 화재)',B:'B급 (유류 화재)',C:'C급 (전기 화재)',K:'K급 (주방 화재)'};
const STAGE_NAMES=['원인 물질 분류','화재 유형별 특징','화재 사례 진단','소화제 선택 실험','소화 원리 연결','대처·대피 시나리오'];
const S=STAGE_NAMES.map(()=>({status:null,attempts:0,note:'',errors:[]}));
const student={name:'',id:''};
let cur=-1, sims=[], used4={};
const app=$('#app');

/* ---------- 점수 ---------- */
const nPass=()=>S.filter(s=>s.status===true).length;
const anyTried=()=>S.some(s=>s.attempts>0);
const scoreOf=n=>anyTried()?Math.max(1,n)*5:0;
const gradeOf=sc=>!anyTried()?'-':sc>=30?'A':sc>=25?'B':sc>=20?'C':sc>=15?'D':'F';
function hud(){
  const sc=scoreOf(nPass());
  $('#hudScore').textContent=sc;$('#hudGrade').textContent=gradeOf(sc)==='-'?'-':gradeOf(sc)+'등급';
  $('#steps').innerHTML=STAGE_NAMES.map((n,i)=>`<button class="stp ${S[i].status===true?'pass':S[i].status===false?'fail':''} ${cur===i?'cur':''}" data-go="${i}" title="${S[i].status===null?'미수행':S[i].status?'충족':'미충족'}"><i>${i+1}</i><span>${n}</span></button>`).join('')
   +`<button class="stp rep ${cur===6?'cur':''}" data-go="6"><i>★</i><span>미션 결과</span></button>`;
}
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;if(!student.name){go(-1);return}go(+b.dataset.go)});
function go(i){sims.forEach(s=>s.stop());sims=[];cur=i;hud();
  if(i===-1)intro();else if(i===6)report();else STAGES[i]();
  window.scrollTo({top:0,behavior:'smooth'});}

function head(i,mission,crit){
  return `<div class="card fx"><div class="mtitle"><span class="tag">STAGE ${i+1} · 평가 항목 ${'①②③④⑤⑥'[i]}</span><h2>${STAGE_NAMES[i]}</h2>${S[i].attempts?`<span class="tag" style="background:#eef3ff;color:#2d4fa3">재도전 ${S[i].attempts}회째</span>`:''}</div><div>${mission}</div><div class="crit">충족 기준 · ${crit}</div></div>`;
}
function finish(i,pass,note,errors){
  S[i].attempts++;S[i].status=pass;S[i].note=note;S[i].errors=errors;hud();
  const all=S.every(s=>s.attempts>0);
  $$('#stagebody button:not([data-keep]), #stagebody select').forEach(b=>b.disabled=true);
  const box=$('#res');
  box.innerHTML=`<div class="res ${pass?'pass':'fail'} fx"><h3 class="${pass?'ht':'hl'}">${pass?'항목 충족! 미션 클리어':'항목 미충족 — 다시 도전해 보세요'}</h3>
  <p>${note}</p>${errors.length?`<ul>${errors.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}
  <p>현재 점수: <span class="hl">${scoreOf(nPass())}점 (${gradeOf(scoreOf(nPass()))}등급)</span> · 충족 ${nPass()}/6개</p>
  <div class="row">${!pass?`<button class="btn" data-act="retry">이 단계 다시 수행하기</button>`:''}
  ${i<5?`<button class="btn teal" data-act="next">다음 단계로</button>`:''}
  ${all||i===5?`<button class="btn ${pass?'':'ghost'}" data-act="rep">미션 결과 보기</button>`:''}</div></div>`;
  box.onclick=e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(a==='retry')go(i);if(a==='next')go(nextStage(i));if(a==='rep')go(6)};
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
function nextStage(i){for(let k=i+1;k<6;k++)if(S[k].attempts===0)return k;return i+1<6?i+1:6}

/* ---------- 드래그 앤 드롭 (마우스·터치 겸용, 탭 선택 지원) ---------- */
function enableDrag(root,accept){
  let selected=null;
  root.addEventListener('pointerdown',e=>{
    const chip=e.target.closest('.chip');if(!chip||root.dataset.lock)return;
    e.preventDefault();const r=chip.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;let moved=false,ghost=null,over=null;
    const mv=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;ghost=chip.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';document.body.appendChild(ghost);chip.classList.add('dragging')}
      if(!moved)return;
      ghost.style.left=ev.clientX-(sx-r.left)+'px';ghost.style.top=ev.clientY-(sy-r.top)+'px';
      const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.dz');const zz=z&&root.contains(z)?z:null;
      if(zz!==over){over&&over.classList.remove('over');over=zz;over&&over.classList.add('over')}
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(moved){ghost.remove();chip.classList.remove('dragging');if(over){over.classList.remove('over');accept(chip,over)}}
      else{ if(selected===chip){chip.classList.remove('sel');selected=null}else{selected&&selected.classList.remove('sel');selected=chip;chip.classList.add('sel')} }
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  root.addEventListener('click',e=>{if(!selected||e.target.closest('.chip')||root.dataset.lock)return;const z=e.target.closest('.dz');if(z){selected.classList.remove('sel');accept(selected,z);selected=null}});
}

/* ---------- 불 시뮬레이터 (캔버스 입자) ---------- */
function FireSim(cv,type,o={}){
  const ctx=cv.getContext('2d');let W=0,H=0,raf;const P=[],SP=[],SM=[];
  const s={type,intensity:o.intensity??1,spraying:false,tool:null,ash:0,temp:o.temp??25,t:0,spread:1,flash:null,flashT:0,onFrame:null,observe:!!o.observe};
  const size=()=>{const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};
  const ro=new ResizeObserver(size);ro.observe(cv);size();
  const base=()=>{const bx=W*.6,by=H*.8;return type==='A'?{x:bx,y:by-26,w:W*.16}:type==='B'?{x:bx,y:by-4,w:W*.26}:type==='C'?{x:bx,y:by-52,w:W*.07}:{x:bx,y:by-46,w:W*.12}};
  const SPC={'물':'#4fb3ff','포말':'#ffffff','이산화탄소':'#e8f4ff','분말':'#ffd2e6','K급':'#d9c2ff'};
  function scene(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2430');g.addColorStop(1,'#4a3540');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const glow=ctx.createRadialGradient(W*.6,H*.7,10,W*.6,H*.7,W*.5);glow.addColorStop(0,`rgba(255,140,40,${.35*s.intensity})`);glow.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3b2c2c';ctx.fillRect(0,H*.8,W,H*.2);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(0,H*.8,W,3);
    const b=base(),bx=W*.6,by=H*.8;
    if(type==='A'){
      if(s.ash>0){ctx.fillStyle='#9a9a9a';ctx.beginPath();ctx.ellipse(bx,by-2,W*.15*Math.min(1,.4+s.ash),8+22*s.ash,0,Math.PI,0);ctx.fill();ctx.fillStyle='#bdbdbd';ctx.beginPath();ctx.ellipse(bx-12,by-6,W*.06*s.ash,6*s.ash+2,0,Math.PI,0);ctx.fill()}
      const burnt=Math.min(1,s.ash);
      [[-1,-.25],[1,.25],[0,0]].forEach(([d,a],k)=>{ctx.save();ctx.translate(bx+d*20,by-14-k*8);ctx.rotate(a);ctx.fillStyle=k===2?'#7b4b26':'#6a3f1f';ctx.globalAlpha=1-burnt*.6;ctx.fillRect(-W*.11,-9,W*.22,18);ctx.fillStyle='#c48a53';ctx.beginPath();ctx.ellipse(W*.11,0,6,9,0,0,7);ctx.fill();ctx.restore()});
      ctx.fillStyle='#e8e2d0';ctx.globalAlpha=1-burnt;ctx.fillRect(bx-60,by-6,40,5);ctx.fillRect(bx+20,by-5,34,4);ctx.globalAlpha=1;
    }else if(type==='B'){
      ctx.fillStyle='#5b3b0a';ctx.beginPath();ctx.ellipse(bx,by+6,W*.27*s.spread**.5,12,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,190,80,.35)';ctx.beginPath();ctx.ellipse(bx-10,by+4,W*.2*s.spread**.5,5,0,0,7);ctx.fill();
      ctx.save();ctx.translate(bx-W*.3,by-18);ctx.rotate(-1.2);ctx.fillStyle='#b23a2a';ctx.fillRect(-18,-26,36,52);ctx.fillStyle='#ddd';ctx.fillRect(-6,-34,12,10);ctx.restore();
    }else if(type==='C'){
      ctx.fillStyle='#d8d8d8';ctx.fillRect(bx-W*.09,by-30,W*.18,24);ctx.fillStyle='#999';for(let k=0;k<4;k++)ctx.fillRect(bx-W*.08+k*W*.042,by-24,10,12);
      ctx.strokeStyle='#222';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(bx+W*.09,by-18);ctx.bezierCurveTo(bx+W*.2,by-10,bx+W*.25,by-80,bx+W*.33,by-140);ctx.stroke();
      ctx.strokeStyle='#c46a2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx+W*.17,by-28);ctx.lineTo(bx+W*.19,by-40);ctx.stroke();
      if(s.intensity>.05&&Math.random()<.35){ctx.strokeStyle='#bfe6ff';ctx.lineWidth=2;ctx.beginPath();let x=bx+(Math.random()-.5)*W*.16,y=by-30;ctx.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*22;y-=10+Math.random()*12;ctx.lineTo(x,y)}ctx.stroke()}
    }else{
      ctx.fillStyle='#555';ctx.fillRect(bx-W*.2,by-20,W*.4,20);ctx.fillStyle='#333';ctx.fillRect(bx-W*.2,by-24,W*.4,6);
      ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.ellipse(bx,by-38,W*.14,16,0,0,Math.PI);ctx.lineTo(bx-W*.14,by-38);ctx.fill();
      ctx.fillRect(bx+W*.13,by-44,W*.12,8);
      ctx.fillStyle='#c98a1c';ctx.beginPath();ctx.ellipse(bx,by-40,W*.13,7,0,0,7);ctx.fill();
      if(s.observe){ctx.fillStyle='#fff';ctx.font='16px a시네마L, Gaegu, sans-serif';ctx.fillText(`기름 온도 ${Math.round(s.temp)}℃`,bx-W*.13,by-80-H*.35)}
    }
    if(s.observe&&type==='A'){ctx.fillStyle='#fff';ctx.font='16px a시네마L, Gaegu, sans-serif';ctx.fillText('재 쌓임 '+Math.round(Math.min(1,s.ash)*100)+'%',bx-40,H-14)}
    if(s.observe&&type==='B'){ctx.fillStyle='#fff';ctx.font='16px a시네마L, Gaegu, sans-serif';ctx.fillText('남은 재: 거의 없음',bx-50,H-14)}
    // 소화기 노즐
    if(s.tool){ctx.fillStyle=s.tool==='물'?'#8a6a3a':'#d42020';ctx.fillRect(10,H*.5,34,H*.3);ctx.fillStyle='#222';ctx.fillRect(40,H*.5+6,30,8)}
  }
  function loop(){
    s.t++;s.onFrame&&s.onFrame(s);
    if(s.observe){if(type==='A')s.ash=Math.min(1,s.ash+.0016);if(type==='K')s.temp=Math.min(372,s.temp+(s.temp<300?1.4:.4))}
    s.spread=Math.max(1,s.spread-.004);
    scene();
    const b=base(),n=Math.round(s.intensity*7*s.spread);
    for(let k=0;k<n;k++)P.push({x:b.x+(Math.random()-.5)*b.w*2*s.spread,y:b.y,vx:(Math.random()-.5)*.6,vy:-(1.4+Math.random()*2.2)*(.7+s.intensity*.5),l:1,r:8+Math.random()*14*(type==='B'?1.2:1)});
    if(s.intensity>.05&&Math.random()<.4)SM.push({x:b.x+(Math.random()-.5)*b.w,y:b.y-70,vx:(Math.random()-.5)*.5,vy:-.8,l:1,r:16});
    ctx.globalCompositeOperation='source-over';
    for(let k=SM.length-1;k>=0;k--){const p=SM[k];p.x+=p.vx;p.y+=p.vy;p.l-=.008;p.r+=.35;if(p.l<=0){SM.splice(k,1);continue}ctx.fillStyle=`rgba(70,65,70,${p.l*.35})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
    ctx.globalCompositeOperation='lighter';
    for(let k=P.length-1;k>=0;k--){const p=P[k];p.x+=p.vx+Math.sin((p.y+s.t)*.05)*.4;p.y+=p.vy;p.l-=.022;p.r*=.975;if(p.l<=0){P.splice(k,1);continue}
      const c=p.l>.7?`255,240,170`:p.l>.4?`255,150,40`:`220,60,30`;ctx.fillStyle=`rgba(${c},${p.l*.55})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
    ctx.globalCompositeOperation='source-over';
    if(s.spraying&&s.tool){const tx=b.x,ty=b.y-10;for(let k=0;k<6;k++){const sx=72,sy=H*.5+10;const a=Math.atan2(ty-sy,tx-sx)+(Math.random()-.5)*.25,v=6+Math.random()*3;SP.push({x:sx,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,r:s.tool==='물'?3:5+Math.random()*5})}}
    for(let k=SP.length-1;k>=0;k--){const p=SP[k];p.x+=p.vx;p.y+=p.vy;p.vy+=s.tool==='물'?.15:.03;p.l-=.02;if(s.tool!=='물')p.r+=.3;if(p.l<=0||p.y>H){SP.splice(k,1);continue}ctx.fillStyle=SPC[s.tool]||'#fff';ctx.globalAlpha=p.l*(s.tool==='물'?.9:.5);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1}
    if(s.flashT>0){s.flashT--;const a=s.flashT/40;
      if(s.flash==='shock'){ctx.fillStyle=`rgba(120,190,255,${a*.6})`;ctx.fillRect(0,0,W,H);ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=4;ctx.beginPath();let x=b.x,y=b.y-20;ctx.moveTo(x,y);while(x>60){x-=20+Math.random()*30;y+=(Math.random()-.5)*40;ctx.lineTo(x,y)}ctx.stroke();
        ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.font='26px a시네마L, Gaegu, sans-serif';ctx.fillText('감전 위험!',W*.05,40)}
      else{ctx.fillStyle=`rgba(255,120,30,${a*.55})`;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.font='26px a시네마L, Gaegu, sans-serif';ctx.fillText(s.flash==='flare'?'불길 급격히 확산!':'재발화!',W*.05,40)}}
    if(s.intensity<=0&&!s.observe){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='26px a시네마L, Gaegu, sans-serif';ctx.fillText('진압 완료',W*.5,H*.35)}
    raf=requestAnimationFrame(loop);
  }
  s.effect=(kind)=>{s.flash=kind;s.flashT=40;if(kind==='flare'){s.intensity=1;s.spread=2.2}if(kind==='reignite'){s.intensity=.95}};
  s.stop=()=>{cancelAnimationFrame(raf);ro.disconnect()};
  loop();sims.push(s);return s;
}

   <p>불은 타는 물질에 따라 <span class="cA">A급</span>·<span class="cB">B급</span>·<span class="cC">C급</span>·<span class="cK">K급</span>으로 나뉘고, 유형마다 끄는 방법이 다릅니다. 6개의 미션을 해결하며 화재 유형 전문가가 되어 보세요.</p>

   <tr><td>점수</td><td>30점</td><td>25점</td><td>20점</td><td>15점</td><td>10점</td><td>5점</td></tr>
   <tr><td>등급</td><td>A</td><td>B</td><td>C</td><td>D</td><td>F</td><td>F</td></tr></table>
   <p style="font-size:15px;color:var(--sub);margin:0">각 항목은 <span class="hl">4개 화재 유형 전체</span>를 정확하게 해결해야 충족됩니다. 내용이 단순하거나 일부만 맞으면 미충족으로 처리됩니다.</p></div>`;
  FireSim($('#introFire'),'A',{intensity:.8});

/* ---------- STAGE 1 ---------- */
const MAT=[['나무 책상 조각','A'],['신문지·종이 상자','A'],['면 커튼(섬유)','A'],['플라스틱 바구니','A'],['알코올램프의 알코올','B'],['휘발유','B'],['페인트 시너','B'],['전류가 흐르는 멀티탭','C'],['피복이 벗겨진 전기 배선','C'],['작동 중인 전기난로','C'],['튀김용 식용유','K'],['돼지기름(동물성 조리용 기름)','K']];
const ZDESC={A:'나무·종이·섬유·플라스틱 등',B:'인화성 액체·유류',C:'전류가 흐르는 기기·배선',K:'동식물성 조리용 기름'};
function st1(){
  app.innerHTML=head(0,'실험실·가정·주방에서 찾은 가연물 카드 12장을 알맞은 화재 등급 구역으로 <span class="ht">끌어다 놓으세요</span>. (카드를 한 번 눌러 선택한 뒤 구역을 눌러도 됩니다.)','A·B·C·K급 4개 유형 모두 누락 없이, 오분류 없이 100% 정확하게 분류')+
  `<div class="card" id="stagebody"><div class="zones">${Object.keys(TYPES).map(t=>`<div class="dz" data-zone="${t}"><h3 class="c${t}">${TYPES[t]}</h3><p>${t==='A'?'타고 나면 재가 남는 고체':t==='B'?'불이 잘 붙는 액체':t==='C'?'전기가 원인':'요리할 때 쓰는 것'}</p><div class="dz-body"></div></div>`).join('')}</div>
  <div class="dz pool" data-zone="pool"><p>가연물 카드</p><div class="dz-body">${shuffle(MAT).map(([n,t])=>`<span class="chip" data-t="${t}" data-n="${n}">${n}</span>`).join('')}</div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="sub1">분류 완료</button><span id="m1" class="hl" style="font-size:16px"></span></div><div id="res"></div></div>`;
  const body=$('#stagebody');
  enableDrag(body,(chip,z)=>z.querySelector('.dz-body').appendChild(chip));
  $('#sub1').onclick=()=>{
    if($$('.pool .chip').length){$('#m1').textContent=`아직 분류하지 않은 카드가 ${$$('.pool .chip').length}장 있어요.`;return}
    const err=[];$$('.chip',body).forEach(c=>{const z=c.closest('.dz').dataset.zone;if(z===c.dataset.t)c.classList.add('ok');else{c.classList.add('bad');err.push(`'${c.dataset.n}'을(를) ${z}급으로 분류함 → 정답 ${c.dataset.t}급`)}});
    body.dataset.lock=1;
    finish(0,err.length===0,err.length===0?'12개의 가연물을 A·B·C·K급 모두 정확하게 분류했습니다.':`12개 중 ${12-err.length}개를 맞혔습니다. 오분류가 있으면 이 항목은 충족되지 않습니다.`,err);
  };
}

/* ---------- STAGE 2 ---------- */
const TAGS=[['연소 후 재가 남는다','A'],['연소 후 재가 거의 남지 않는다','B'],['전류가 흐르는 상태라 감전 위험이 있다','C'],['B급 인화 물질보다 인화점이 높고 매우 고온이어서 일반 화재보다 소화가 어렵다','K'],['기름이 타고 나면 재가 많이 남는다','x'],['물을 뿌리면 가장 빨리 꺼진다','x'],['전원을 차단해도 감전 위험은 그대로 커진다','x']];
const OBS={A:'나무와 종이가 타면서 회색 재가 점점 쌓입니다. 재는 타고 남은 고체 물질입니다.',B:'바닥에 흐른 유류 표면 전체에서 불꽃이 넓게 일어나고, 다 타도 재가 거의 남지 않습니다.',C:'멀티탭 주변에서 파란 스파크가 튑니다. 전기가 흐르는 동안에는 손이나 물이 닿으면 위험합니다.',K:'기름 온도가 300℃를 넘어 계속 올라갑니다. 식용유는 인화점이 높아 한 번 불이 붙으면 매우 뜨겁습니다.'};
function st2(){
  const seen=new Set();let sim=null;
  app.innerHTML=head(1,'각 화재 유형 버튼을 눌러 <span class="ht">가상 연소 장면을 모두 관찰</span>한 뒤, 오른쪽 특징표에 알맞은 특징 태그를 끌어다 놓으세요. 태그 중에는 <span class="hl">오개념 함정</span>이 숨어 있습니다.','4개 유형의 핵심 특징을 혼동 없이 정확히 연결하고 오개념 태그를 배제')+
  `<div class="card" id="stagebody"><div class="grid2"><div>
   <div class="typebtns">${Object.keys(TYPES).map(t=>`<button class="tb" data-t="${t}" data-keep><span class="dot"></span><span class="badge b${t}">${t}</span>${TYPES[t].split(' ')[1].replace(/[()]/g,'')}</button>`).join('')}</div>
   <div class="fig"><canvas id="cv2"></canvas><span class="lab" id="lab2">유형을 선택하세요</span></div>
   <div class="note" id="obs" style="margin-top:10px">관찰 기록이 여기에 나타납니다. (관찰 완료 <span id="seenN">0</span>/4)</div>
  </div><div>
   <table class="ft">${Object.keys(TYPES).map(t=>`<tr><td style="width:120px"><span class="badge b${t}">${t}</span> <span class="c${t}">${TYPES[t].split(' ')[1].replace(/[()]/g,'')}</span></td><td><div class="dz slot" data-zone="${t}" style="min-height:56px"><div class="dz-body"></div></div></td></tr>`).join('')}</table>
   <div class="dz pool" data-zone="pool"><p>특징 태그</p><div class="dz-body">${shuffle(TAGS).map(([n,t],k)=>`<span class="chip" data-t="${t}" data-n="${n}">${n}</span>`).join('')}</div></div>
  </div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="sub2">특징표 완성</button><span id="m2" class="hl" style="font-size:16px"></span></div><div id="res"></div></div>`;
  const body=$('#stagebody');
  $$('.tb').forEach(b=>b.onclick=()=>{if(body.dataset.lock)return;const t=b.dataset.t;sims.forEach(s=>s.stop());sims=[];sim=FireSim($('#cv2'),t,{observe:true,temp:180});$$('.tb').forEach(x=>x.classList.toggle('on',x===b));$('#lab2').textContent=TYPES[t]+' 관찰 중';
    setTimeout(()=>{if(cur!==1||$('.tb.on')?.dataset.t!==t)return;seen.add(t);b.classList.add('seen');$('#seenN').textContent=seen.size},2500);
    $('#obs').innerHTML=`<span class="c${t}">${TYPES[t]}</span> · ${OBS[t]} <span style="color:var(--sub)">(관찰 완료 <span id="seenN">${seen.size}</span>/4)</span>`});
  enableDrag(body,(chip,z)=>{const tb=z.querySelector('.dz-body');if(z.dataset.zone!=='pool'){const old=tb.querySelector('.chip');if(old&&old!==chip)$('.pool .dz-body').appendChild(old)}tb.appendChild(chip)});
  $('#sub2').onclick=()=>{
    if(seen.size<4){$('#m2').textContent=`4개 유형의 연소 장면을 모두 관찰해야 해요. (현재 ${seen.size}/4)`;return}
    const slots=$$('.slot',body);if(slots.some(s=>!s.querySelector('.chip'))){$('#m2').textContent='4개 칸을 모두 채워 주세요.';return}
    const err=[];slots.forEach(s=>{const c=s.querySelector('.chip'),t=s.dataset.zone;if(c.dataset.t===t)c.classList.add('ok');else{c.classList.add('bad');err.push(c.dataset.t==='x'?`${t}급에 오개념 태그 '${c.dataset.n}'을(를) 연결함`:`${t}급에 ${c.dataset.t}급의 특징 '${c.dataset.n}'을(를) 연결함`)}});
    body.dataset.lock=1;
    finish(1,!err.length,!err.length?'4개 유형의 연소 장면을 모두 관찰하고, 오개념 태그를 배제하여 핵심 특징을 정확히 연결했습니다.':'특징 연결에 혼동이 있습니다. 관찰 장면을 다시 떠올려 보세요.',err);
  };
}

/* ---------- STAGE 3 ---------- */
const CASES=[
 {t:'A',title:'공원 쓰레기통 화재',txt:'누군가 완전히 끄지 않은 담배꽁초를 쓰레기통에 버렸다. 잠시 뒤 안에 있던 종이컵과 낙엽에서 연기가 나더니 불길이 솟았다.',c:0},
 {t:'B',title:'석유난로 전도 화재',txt:'거실의 석유난로가 넘어지면서 등유가 바닥으로 새어 나왔다. 퍼진 기름과 증기에 난로의 불꽃이 닿자 순식간에 불이 바닥에 번졌다.',c:1},
 {t:'C',title:'노후 멀티탭 화재',txt:'20년 된 집에서 멀티탭 하나에 전열기구 여러 개를 꽂아 썼다. 피복이 갈라진 전선에서 "탁" 소리와 함께 불꽃이 튀며 연기가 났다.',c:2},
 {t:'K',title:'튀김기 기름 화재',txt:'튀김 요리를 하던 중 기름을 불에 올려 둔 채 자리를 비웠다. 돌아와 보니 냄비 속 식용유에서 불길이 치솟고 있었다.',c:3}];
const CAUSE=['불씨(담뱃불)를 부주의하게 취급하여 종이·낙엽 같은 일반 가연물에 옮겨 붙음','새어 나온 유류와 그 증기에 점화원(불꽃)이 닿음','오래된 배선의 피복이 손상되어 합선·과부하로 열과 스파크가 발생함','식용유가 과열되어 발화점 이상으로 온도가 올라감','공기 중 산소가 갑자기 늘어나 저절로 불이 붙음','차가운 물이 닿으면서 화학 반응이 일어남'];
function st3(){
  const ans=CASES.map(()=>({g:null,c:null}));
  app.innerHTML=head(2,'일상에서 일어난 화재 사건 파일 4건을 읽고, <span class="ht">화재 등급</span>을 판별한 뒤 <span class="ht">핵심 발화 원인</span>을 고르세요.','4개 사례를 모두 올바른 등급과 연결하고, 각 사례의 발생 원인까지 구체적으로 매칭')+
  `<div class="card" id="stagebody"><div class="grid2">${shuffle(CASES.map((c,i)=>({...c,i}))).map(c=>`<div class="case" data-i="${c.i}"><h3>사건 파일 · ${c.title}</h3><p style="margin:0 0 8px;font-size:16px">${c.txt}</p>
   <div style="font-size:15px;color:var(--sub)">① 화재 등급</div><div class="row" style="gap:6px;margin:4px 0 8px">${'ABCK'.split('').map(g=>`<button class="gbtn g${g}" data-g="${g}">${g}급</button>`).join('')}</div>
   <div style="font-size:15px;color:var(--sub)">② 핵심 발화 원인</div>${shuffle(CAUSE.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-c="${o.k}">${o.t}</button>`).join('')}</div>`).join('')}</div>
  <div class="row"><button class="btn" id="sub3">진단 제출</button><span id="m3" class="hl" style="font-size:16px"></span></div><div id="res"></div></div>`;
  $$('.case').forEach(box=>{const i=+box.dataset.i;
    box.addEventListener('click',e=>{const g=e.target.closest('.gbtn'),o=e.target.closest('.opt');
      if(g){ans[i].g=g.dataset.g;$$('.gbtn',box).forEach(x=>x.classList.toggle('on',x===g))}
      if(o){ans[i].c=+o.dataset.c;$$('.opt',box).forEach(x=>x.classList.toggle('on',x===o))}})});
  $('#sub3').onclick=()=>{
    if(ans.some(a=>!a.g||a.c===null)){$('#m3').textContent='4건 모두 등급과 원인을 선택해 주세요.';return}
    const err=[];CASES.forEach((c,i)=>{const box=$(`.case[data-i="${i}"]`);
      const gb=$(`.gbtn.on`,box),ob=$(`.opt.on`,box);
      if(ans[i].g!==c.t){err.push(`'${c.title}'을(를) ${ans[i].g}급으로 판별함 → 정답 ${c.t}급`);gb.style.outline='3px solid var(--no)'}
      if(ans[i].c!==c.c){err.push(`'${c.title}'의 원인을 잘못 고름 → 정답: ${CAUSE[c.c]}`);ob.classList.add('wrong')}else ob.classList.add('good')});
    finish(2,!err.length,!err.length?'4건의 실제 사례를 모두 올바른 등급과 연결하고, 발화 원인까지 정확히 진단했습니다.':`등급 판별 또는 원인 매칭에서 ${err.length}건의 오류가 있습니다.`,err);
  };
}

/* ---------- STAGE 4 ---------- */
const TOOLS=[['물','물 양동이','#4fb3ff'],['포말','포말(폼) 소화기','#f2f2f2'],['이산화탄소','이산화탄소 소화기','#9fb7c9'],['분말','분말(ABC) 소화기','#f4a6c4'],['K급','K급 전용 소화기','#b79cf0']];
const REACT={A:{물:'ok',포말:'ok',분말:'ok',K급:'ok',이산화탄소:'re'},B:{포말:'ok',이산화탄소:'ok',분말:'ok',물:'flare',K급:'re'},C:{이산화탄소:'ok',분말:'ok',물:'shock',포말:'shock',K급:'shock'},K:{K급:'ok',물:'flare',포말:'re',이산화탄소:'re',분말:'re'}};
const MSG={
 'A-re':'이산화탄소가 표면의 산소만 잠시 막았지만, 나무 속 불씨가 식지 않아 다시 타올랐습니다. 일반 화재는 깊숙이 냉각해야 합니다.',
 'B-flare':'물이 기름보다 무거워 아래로 가라앉고, 기름이 물 위로 떠서 튀며 불길이 넓게 번졌습니다.',
 'B-re':'K급 약제는 유류 화재용이 아니어서 유증기에 다시 불이 붙었습니다.',
 'C-shock':'물(수분)이 포함된 약제는 전기가 통합니다. 전류가 약제를 타고 흘러 감전 위험이 발생했습니다.',
 'K-flare':'고온의 기름에 물이 닿자 물이 순간적으로 끓어 기화하면서 기름이 사방으로 튀어 불길이 폭발적으로 커졌습니다.',
 'K-re':'불꽃은 잠시 줄었지만 기름 온도가 여전히 발화점 이상이어서 다시 불이 붙었습니다.'};
function st4(){
  const st={A:{done:false,err:[]},B:{done:false,err:[]},C:{done:false,err:[]},K:{done:false,err:[]}};const usedTools={A:[],B:[],C:[],K:[]};
  let curT='A',tool=null,sim=null;
  app.innerHTML=head(3,'4곳의 화재 현장에서 소화제를 고른 뒤 <span class="ht">[분사] 버튼을 누르고 있으면</span> 직접 진압합니다. 잘못된 소화제를 쓰면 실제처럼 위험한 반응이 나타납니다.','4개 유형의 화재를 모두 위험 반응(감전·확산·재발화) 없이 적합한 소화제로 진압')+
  `<div class="card" id="stagebody"><div class="typebtns" id="tabs4"></div><div class="grid2"><div>
   <div class="fig" style="height:360px"><canvas id="cv4"></canvas><span class="lab" id="lab4"></span></div>
   <div style="margin-top:8px;font-size:15px">불의 세기</div><div class="meter"><div id="mtr"></div></div>
  </div><div>
   <div style="font-size:16px;color:var(--sub)">소화제 선택</div>
   <div class="tools">${TOOLS.map(([k,n,c])=>`<button class="tool" data-k="${k}" data-keep><svg width="28" height="40" viewBox="0 0 28 40"><rect x="6" y="8" width="16" height="30" rx="5" fill="${c}" stroke="#555"/><rect x="10" y="2" width="8" height="7" fill="#444"/>${k==='물'?'':'<path d="M18 5h8" stroke="#444" stroke-width="3"/>'}</svg>${n}</button>`).join('')}</div>
   <button class="btn teal spray" id="spray" data-keep>누르고 있으면 분사</button>
   <div class="log" id="log4" style="margin-top:10px"><p style="color:var(--sub)">진압 기록</p></div>
  </div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="sub4" disabled>진압 실험 완료</button><span id="m4" style="font-size:16px;color:var(--sub)">4곳을 모두 진압하면 완료할 수 있어요.</span></div><div id="res"></div></div>`;
  const log=(t,cls='')=>{$('#log4').insertAdjacentHTML('beforeend',`<p class="${cls}">${t}</p>`);$('#log4').scrollTop=1e6};
  function tabs(){$('#tabs4').innerHTML=Object.keys(TYPES).map(t=>`<button class="tb ${t===curT?'on':''} ${st[t].done?'seen':''}" data-t="${t}" data-keep><span class="dot" style="${st[t].err.length&&st[t].done?'background:var(--yel)':''}"></span><span class="badge b${t}">${t}</span>${TYPES[t].split(' ')[1].replace(/[()]/g,'')}</button>`).join('')}
  function load(t){curT=t;sims.forEach(s=>s.stop());sims=[];sim=FireSim($('#cv4'),t,{intensity:st[t].done?0:1});sim.tool=tool;sim.onFrame=frame;$('#lab4').textContent=TYPES[t]+' 현장';tabs()}
  function frame(s){
    const m=$('#mtr');if(!m)return;m.style.width=Math.max(0,s.intensity*100)+'%';
    if(!s.spraying||st[curT].done||!tool)return;
    s.sprayT=(s.sprayT||0)+1;const r=REACT[curT][tool];
    if(r==='ok'){s.intensity=Math.max(0,s.intensity-.006);if(s.intensity<=0){st[curT].done=true;stop();log(`<span class="c${curT}">${curT}급</span>: ${TOOLS.find(x=>x[0]===tool)[1]}(으)로 진압 성공`,'ht');tabs();check()}}
    else if(r==='re'){s.intensity=Math.max(.12,s.intensity-.006);if(s.intensity<=.12){s.effect('reignite');stop();danger('re')}}
    else if(s.sprayT>22){s.effect(r);stop();danger(r)}
  }
  function danger(r){const m=MSG[curT+'-'+r];st[curT].err.push(`${curT}급 화재에 ${TOOLS.find(x=>x[0]===tool)[1]} 사용 → ${r==='shock'?'감전':r==='flare'?'불길 확산':'재발화'}`);log(`<span class="hl">${curT}급 위험 반응</span>: ${m}`)}
  function stop(){if(sim){sim.spraying=false;sim.sprayT=0}$('#spray').classList.remove('act')}
  function check(){const all=Object.values(st).every(x=>x.done);$('#sub4').disabled=!all;if(all)$('#m4').textContent='모든 현장 진압 완료! 결과를 제출하세요.';else{const nx=Object.keys(st).find(k=>!st[k].done);setTimeout(()=>{if(cur===3&&!st[curT].done)return;if(cur===3)load(nx)},1200)}}
  $('#tabs4').onclick=e=>{const b=e.target.closest('.tb');if(b&&!$('#stagebody').dataset.lock){stop();load(b.dataset.t)}};
  $$('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.k;if(sim)sim.tool=tool;$$('.tool').forEach(x=>x.classList.toggle('on',x===b))});
  const sp=$('#spray');
  sp.addEventListener('pointerdown',e=>{e.preventDefault();if($('#stagebody').dataset.lock)return;if(!tool){log('먼저 소화제를 선택하세요.','hl');return}if(st[curT].done){log('이미 진압한 현장입니다. 다른 현장을 선택하세요.');return}
    if(!usedTools[curT].includes(tool))usedTools[curT].push(tool);sim.spraying=true;sim.sprayT=0;sp.classList.add('act')});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>sp.addEventListener(ev,stop));
  load('A');
  $('#sub4').onclick=()=>{

        $('#scene6').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300})}});
  }
  show();
}
const STAGES=[st1,st2,st3,st4,st5,st6];

/* ---------- 미션 결과 ---------- */
const PASSFB=[
 '원인 물질 분류: 나무·종이·섬유 같은 일반 가연물, 알코올·휘발유 같은 유류, 전류가 흐르는 기기, 조리용 기름을 정확히 구별하여 화재 유형을 나누는 기준을 잘 이해했습니다.',
 '특징 분석: 연소 장면을 모두 관찰하고 재의 유무, 감전 위험, 고온의 식용유라는 핵심 특징을 오개념에 흔들리지 않고 연결했습니다.',
 '사례 진단: 일상의 화재 사건에서 타는 물질과 점화원을 찾아 등급과 발화 원인을 구체적으로 설명할 수 있습니다.',
 '소화제 선택: 위험 반응 없이 각 화재에 맞는 소화제를 골라 진압하여, 잘못된 소화제가 감전·확산·재발화를 일으킨다는 점을 잘 알고 있습니다.',
 '소화 원리: 소화제가 연소의 3요소 중 무엇을 차단하는지(냉각·질식·비누화) 과학적으로 연결하고 다른 소화제를 쓰면 안 되는 이유까지 설명했습니다.',
 '대처·대피: 경보와 신고, 소화기 4단계, 진압 중단 판단, 불길 역류·감전·기름 확산 주의, 낮은 자세로 계단 대피까지 안전하게 해냈습니다.'];
const FAILFB=[
 '원인 물질 분류가 아직 정확하지 않습니다. 고체(재가 남음)인지, 불이 잘 붙는 액체인지, 전기가 흐르는지, 요리용 기름인지를 차례로 따져 보세요.',
 '특징 연결에 혼동이 있습니다. 특히 "기름은 타고 나서 재가 많이 남는다", "물이면 다 꺼진다" 같은 오개념에 주의하며 연소 장면을 다시 관찰해 보세요.',
 '사례 진단에서 등급 또는 원인 매칭이 틀렸습니다. 사건 속에서 무엇이 탔는지(가연물)와 무엇이 불을 붙였는지(점화원)를 분리해서 읽어 보세요.',
 '소화제 선택 실험에서 위험 반응이 있었습니다. 전기 화재에는 물이 섞인 약제를, 유류·주방 화재에는 물을 쓰면 안 되는 이유를 떠올려 다시 진압해 보세요.',
 '소화 원리 연결이 불완전합니다. 냉각은 온도를, 질식은 산소를 차단한다는 점과 K급 약제의 비누화 작용을 연소 삼각형으로 확인해 보세요.',
 '대처·대피 시나리오에서 치명적 오류가 있었습니다. 문 열기 전 손잡이 온도 확인, 전기 화재의 전원 차단, 기름 화재의 물 금지, 엘리베이터 금지를 다시 점검하세요.'];
function report(){
  const n=nPass(),sc=scoreOf(n),gr=gradeOf(sc),all=S.every(s=>s.attempts>0);
  const totalRetry=S.reduce((a,s)=>a+Math.max(0,s.attempts-1),0);
  const failed=S.map((s,i)=>i).filter(i=>S[i].status!==true);
  const nextGr={F:'D',D:'C',C:'B',B:'A'}[gr];
  const fbLines=S.map((s,i)=>{if(!s.attempts)return `<p><span class="hy">STAGE ${i+1}</span> 아직 수행하지 않았습니다.</p>`;
    const tr=s.attempts>1?` (${s.attempts}번 시도${s.status?' 끝에 스스로 보완하여 충족':''})`:'';
    return `<p><span class="${s.status?'ht':'hl'}">STAGE ${i+1}${tr}</span> ${s.status?PASSFB[i]:FAILFB[i]}${!s.status&&s.errors.length?` <span style="color:var(--sub)">예: ${s.errors[0]}</span>`:''}</p>`}).join('');
  const summary=!anyTried()?'아직 수행한 단계가 없습니다.':n===6?`${student.name} 학생은 6개 평가 항목을 모두 충족했습니다. ${totalRetry?`처음에 부족했던 단계를 ${totalRetry}회 재도전하여 스스로 보완한 점이 특히 훌륭합니다. `:''}화재 유형의 분류부터 소화 원리, 실제 대피 행동까지 하나로 연결해 설명할 수 있는 수준입니다.`
   :`${student.name} 학생은 6개 항목 중 ${n}개를 충족했습니다. ${S.filter(s=>s.status).length?'충족한 단계에서는 화재 유형에 대한 개념이 잘 잡혀 있습니다. ':''}미충족 단계(${failed.map(i=>i+1).join(', ')}단계)를 보완하면 화재 유형을 과학적으로 이해하고 안전하게 대응하는 능력이 완성됩니다.`;
  app.innerHTML=`<div class="report fx" id="rep"><div class="rhead"><div><h2>${all&&n===6?'미션 성공!':all?'미션 결과 리포트':'중간 결과 리포트'}</h2><div style="color:var(--sub)">화재 유형 탐구 (30점) · ${new Date().toLocaleDateString('ko-KR')}</div></div>
   <div class="row"><img src="${$('.brand img').src}" width="56" height="56" alt="EARTH LJY 로고"><div style="font-size:15px">EARTHLJY 안좌고 지영T<br><span class="ht">earthljy@ai.jne.kr</span></div></div></div>
   <div class="row" style="justify-content:space-between"><div style="font-size:19px">이름 <span class="ht">${student.name}</span> · 학번 <span class="ht">${student.id}</span></div><div>총 재수행 <span class="hl">${totalRetry}</span>회</div></div>
   <div class="gradebox"><div class="gradebig">${gr}</div><div><div style="font-size:34px;line-height:1.1"><span class="hl">${sc}</span> / 30점</div><div>충족 항목 ${n} / 6개</div>
    <div class="ladder">${[['A','30점'],['B','25점'],['C','20점'],['D','15점'],['F','10점 이하']].map(([g,p])=>`<span class="${g===gr?'me':''}">${g} ${p}</span>`).join('')}</div></div></div>
   <table class="st"><tr><th>평가 항목</th><th>충족</th><th>시도</th><th class="noprint-x">재수행</th></tr>
   ${STAGE_NAMES.map((nm,i)=>`<tr><td class="l">${'①②③④⑤⑥'[i]} ${nm}</td><td>${S[i].status===true?'<span class="o">O</span>':S[i].status===false?'<span class="x">X</span>':'-'}</td><td>${S[i].attempts}회</td><td>${Math.max(0,S[i].attempts-1)}회</td></tr>`).join('')}</table>
   <h3 style="margin:14px 0 4px;font-size:23px;color:var(--teal)">과제 수행 과정 피드백</h3>
   <div class="fb"><p>${summary}</p>${fbLines}</div>
   ${failed.length?`<div class="up" data-html2canvas-ignore><div style="font-size:20px"><span class="hl">${gr}등급 → ${nextGr}등급</span>으로 올리려면?</div>
    <p style="margin:4px 0">미충족 항목 <span class="hl">1개</span>를 더 충족하면 5점이 올라 ${nextGr}등급이 됩니다. 이미 충족한 단계는 다시 할 필요가 없어요. 아래의 <span class="ht">부족한 단계만</span> 다시 수행하세요.</p>
    <div class="row">${failed.map(i=>`<button class="btn" data-go="${i}">${i+1}단계 ${STAGE_NAMES[i]} ${S[i].attempts?'다시 수행하기':'수행하기'}</button>`).join('')}</div></div>`
   :`<div class="up" style="background:#e8f7ee;border-color:#9ad5b2"><span class="ht">최고 등급 A를 달성했습니다.</span> 모든 평가 항목을 충족했어요.</div>`}
  </div>
  <div class="row noprint" style="margin-top:16px"><button class="btn teal" id="dlImg">결과 이미지 저장 (PNG)</button><button class="btn ghost" id="dlPdf">PDF로 저장 (인쇄)</button><span id="dlMsg" style="font-size:15px;color:var(--sub)"></span></div>`;
  $('#rep').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
  $('#dlImg').onclick=async()=>{
    if(typeof html2canvas==='undefined'){$('#dlMsg').textContent='인터넷 연결이 필요합니다. PDF 저장(인쇄)을 이용하거나 화면을 캡처하세요.';return}
    $('#dlMsg').textContent='이미지를 만드는 중…';
    try{const c=await html2canvas($('#rep'),{scale:2,backgroundColor:'#ffffff'});const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`화재유형탐구_${student.id}_${student.name}.png`;document.body.appendChild(a);a.click();a.remove();$('#dlMsg').textContent='저장했습니다.'}
    catch(err){$('#dlMsg').textContent='저장에 실패했습니다. PDF 저장(인쇄)을 이용하세요.'}};
  $('#dlPdf').onclick=()=>{try{window.print()}catch(e){$('#dlMsg').textContent='인쇄 창을 열 수 없습니다.'}};
}

go(-1);
}
</script>
